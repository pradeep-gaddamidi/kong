openapi: 3.0.3
info:
  title: ShopGlobal Shopping Assistant API
  version: 1.0.0
  description: >-
    OpenAI-compatible chat endpoint used by the ShopGlobal bot backend. The gateway
    chooses the model (smart routing), enforces budgets and guards, and reports which
    model answered in the X-Kong-LLM-Model response header. Callers never send a model
    name or a provider key.

    AI policies (routing, budgets, guards, cache) are NOT defined here: they are owned by
    the platform team in apiops/policies/ and attached during the build.
  contact:
    name: ShopGlobal Platform Team

# Placeholder upstream: ai-proxy-advanced sets the real destination (OpenAI) per request.
servers:
  - url: http://localhost:32000

x-kong-name: shop-assistant
x-kong-tags: [shopglobal-ai, apiops, assistant]

security:
  - apikey: []

paths:
  /assistant/chat:
    post:
      operationId: chat
      summary: Ask the shopping assistant (gateway picks cheap or premium model)
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChatRequest"}
            example:
              messages:
                - {role: system, content: "Facts for this conversation from ShopGlobal systems: {...}"}
                - {role: user, content: "¿Dónde está mi pedido ORD-2024-10002?"}
      parameters:
        - name: Cache-Control
          in: header
          required: false
          description: Send "no-store" when the prompt contains personal order data
          schema: {type: string, enum: [no-store]}
      responses:
        "200":
          description: Model answer
          headers:
            X-Kong-LLM-Model:
              description: Provider/model that answered, e.g. openai/gpt-6-luna
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatResponse"}
        "400":
          description: Blocked by a prompt guard (no model cost)
        "401":
          description: Missing or invalid API key
        "429":
          description: Consumer budget exhausted (see X-AI-RateLimit-* headers)
  /assistant/order-status:
    post:
      operationId: orderStatus
      summary: '"Check Order Status" button: always the cheap model, no routing step'
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChatRequest"}
      responses:
        "200":
          description: Model answer
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChatResponse"}
        "401":
          description: Missing or invalid API key
        "429":
          description: Consumer budget exhausted

components:
  securitySchemes:
    apikey:
      type: apiKey
      in: header
      name: apikey
  schemas:
    ChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          items:
            type: object
            required: [role, content]
            properties:
              role: {type: string, enum: [system, user, assistant]}
              content: {type: string}
    ChatResponse:
      type: object
      properties:
        model: {type: string}
        choices:
          type: array
          items:
            type: object
            properties:
              message:
                type: object
                properties:
                  role: {type: string}
                  content: {type: string}
        usage:
          type: object
          properties:
            prompt_tokens: {type: integer}
            completion_tokens: {type: integer}
            total_tokens: {type: integer}
