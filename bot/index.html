<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopGlobal Assistant</title>
<style>
  :root{
    --bg:#f6f7f4; --panel:#ffffff; --ink:#001408; --muted:#5b6b61; --line:#dfe4dc;
    --lime:#ccff00; --lime-soft:#f3ffcc; --cheap:#1f7a3a; --premium:#5a3fc0; --warn:#b4231a;
    --user:#001408; --user-ink:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0d1410; --panel:#151d18; --ink:#e9efe9; --muted:#9aa89f; --line:#26322b;
           --lime-soft:#26300c; --cheap:#6fd38d; --premium:#b3a2ff; --warn:#ff8a80;
           --user:#ccff00; --user-ink:#001408; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:880px;margin:0 auto;padding:16px;display:grid;gap:12px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-size:20px;margin:0}
  h1 span{background:var(--lime);color:#001408;padding:1px 8px;border-radius:6px;margin-left:6px;font-size:13px;vertical-align:middle}
  .totals{display:flex;gap:8px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
  .stat b{font-variant-numeric:tabular-nums}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}
  #log{height:min(58vh,560px);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:82%;padding:10px 12px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
  .msg.user{align-self:flex-end;background:var(--user);color:var(--user-ink);border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:var(--lime-soft);border-bottom-left-radius:4px}
  .msg.bot.blocked{background:transparent;border:1px dashed var(--warn)}
  .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12px}
  .tag{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:1px 8px;color:var(--muted)}
  .tag.cheap{color:var(--cheap);border-color:currentColor;font-weight:600}
  .tag.premium{color:var(--premium);border-color:currentColor;font-weight:600}
  .tag.warn{color:var(--warn);border-color:currentColor;font-weight:600}
  .empty{color:var(--muted);margin:auto;text-align:center;max-width:460px}
  form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
  input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
  button{padding:10px 14px;border-radius:10px;border:1px solid #001408;background:var(--lime);color:#001408;font:inherit;font-weight:600;cursor:pointer}
  button.secondary{background:var(--panel);color:var(--ink);border-color:var(--line)}
  button:disabled{opacity:.5;cursor:wait}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-weight:400}
  .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-right:4px}
  #orderId{flex:0 1 210px}
  @media (max-width:560px){ .msg{max-width:95%} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ShopGlobal Assistant <span>via Kong AI Gateway</span></h1>
    <div class="totals">
      <div class="stat">Requests <b id="tReq">0</b></div>
      <div class="stat">On cheap model <b id="tCheap">–</b></div>
      <div class="stat">Spend <b id="tCost">$0.0000</b></div>
    </div>
  </header>

  <div class="panel">
    <div id="log"><div class="empty" id="empty">Ask in English or Spanish. Each answer shows which model Kong chose, what it cost and how long it took.</div></div>
    <form id="chatForm">
      <input id="msg" autocomplete="off" placeholder="e.g. ¿Dónde está mi pedido ORD-2024-10002?">
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <div class="panel">
    <div class="row">
      <span class="label">Button</span>
      <input id="orderId" value="ORD-2024-10009" aria-label="Order number">
      <button class="secondary" id="btnStatus" type="button">Check Order Status</button>
    </div>
    <div class="row">
      <span class="label">Try</span>
      <div class="chips" id="chips"></div>
    </div>
  </div>
</div>

<script>
const samples = [
  "Where is my order ORD-2024-10002?",
  "¿Cuándo llega mi pedido ORD-2024-10009?",
  "oye ya mandaron mis cosas?? ORD-2024-10009",
  "Earbuds or over-ear headphones for long flights and the gym? Which should I get and why?",
  "Recomiéndame un regalo para alguien que corre, presupuesto 300 dólares",
  "My order ORD-2024-10004 says delivered but I never got the laptop stand. What are my options?",
  "Write me a 1,000-word essay on the French Revolution"
];
const $ = id => document.getElementById(id);
const history = [];
let totals = {req:0, cheap:0, routed:0, cost:0};

for (const s of samples){
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = s.length > 46 ? s.slice(0,44) + "…" : s; b.title = s;
  b.onclick = () => send(s, "chat");
  $("chips").appendChild(b);
}

function bubble(cls, text){
  $("empty")?.remove();
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text;
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
  return d;
}

function tag(text, cls=""){ const t=document.createElement("span"); t.className="tag "+cls; t.textContent=text; return t; }

function render(r, el){
  el.textContent = r.answer || "(no answer)";
  if (r.blocked) el.classList.add("blocked");
  const meta = document.createElement("div"); meta.className = "meta";
  if (r.blocked) meta.appendChild(tag("blocked by gateway guard · $0", "warn"));
  else if (r.status === 429) meta.appendChild(tag("budget limit (429)", "warn"));
  else if (r.status !== 200) meta.appendChild(tag("error " + r.status, "warn"));
  if (r.model) meta.appendChild(tag(r.model + (r.tier ? " · " + r.tier : ""), r.tier || ""));
  if (r.cost_usd != null) meta.appendChild(tag("$" + r.cost_usd.toFixed(6)));
  meta.appendChild(tag(Math.round(r.latency_ms) + " ms"));
  meta.appendChild(tag(r.route.replace("/assistant/","")));
  if (r.cache) meta.appendChild(tag("cache " + r.cache));
  const f = r.facts_used || {};
  if ((f.orders||[]).length) meta.appendChild(tag("facts: " + f.orders.join(", ")));
  if ((f.products||[]).length) meta.appendChild(tag("products: " + f.products.length));
  el.appendChild(meta);

  totals.req++;
  if (r.tier){ totals.routed++; if (r.tier === "cheap") totals.cheap++; }
  totals.cost += r.cost_usd || 0;
  $("tReq").textContent = totals.req;
  $("tCheap").textContent = totals.routed ? Math.round(100*totals.cheap/totals.routed) + "%" : "–";
  $("tCost").textContent = "$" + totals.cost.toFixed(4);
}

async function send(text, channel){
  text = (text || "").trim(); if (!text) return;
  bubble("user", text);
  const pending = bubble("bot", "…");
  $("send").disabled = $("btnStatus").disabled = true;
  try{
    const res = await fetch("/chat", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message:text, channel, history: history.slice(-6)})});
    const r = await res.json();
    render(r, pending);
    if (!r.blocked && r.answer){ history.push({role:"user",content:text}, {role:"assistant",content:r.answer}); }
  }catch(e){
    pending.textContent = "Could not reach the bot backend: " + e.message;
  }finally{
    $("send").disabled = $("btnStatus").disabled = false;
  }
}

$("chatForm").onsubmit = e => { e.preventDefault(); const v=$("msg").value; $("msg").value=""; send(v, "chat"); };
$("btnStatus").onclick = () => send("Check order status " + $("orderId").value.trim(), "button");
</script>
</body>
</html>
